<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HLL Default Garrisons</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffc107">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HLL Default Garrisons">

  <link rel="icon" type="image/webp" href="images/favicon.webp">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/icon-180.png">
  <link rel="stylesheet" href="css/style.css?v=3.36">
  
  <script>
    if ('serviceWorker' in navigator) {
      // Only register if we are online (HTTP/HTTPS) to avoid errors when testing locally
      if (window.location.protocol.indexOf('http') === 0) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js?v=8')
            .then((reg) => console.log('Service Worker registered.', reg))
            .catch((err) => console.log('Service Worker registration failed.', err));
        });
      }
    }
  </script>
</head>
<body>
  <div class="shell">
    <div class="panel map-wrap" id="mapContainer">
      <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading map...</div>
      </div>
      
      <div class="map-stage" id="mapStage">
        <img 
          id="mapImage" 
          class="map-image"
          src="images/maps/map_carentan.webp" 
          alt="Carentan Map"
        >
        <div id="markers" class="markers-layer"></div>
      </div>
    </div>

    <div class="main-ui-overlay">
      
      <div class="scale-container">
        <div class="scale-wrapper" id="scaleWrapper">
          <div class="scale-bar-graphic">
            <div class="scale-tick t-start"></div>
            <div class="scale-tick t-mid"></div>
            <div class="scale-tick t-end"></div>
          </div>
          <div class="scale-labels">
            <span class="scale-lbl l-start">0</span>
            <span id="scaleTextMid" class="scale-lbl l-mid">125m</span>
            <span id="scaleTextEnd" class="scale-lbl l-end">250m</span>
          </div>
        </div>

        <div class="zoom-indicator-inline">
          <span id="zoomIndicator">1.0x</span>
        </div>
      </div>
      
      <div class="controls-drawer" id="controlsDrawer">
        <button id="drawerToggleBtn" class="drawer-tab" aria-label="Toggle controls drawer" aria-expanded="true">
          <span class="tab-arrow">▼</span>
        </button>

        <div class="fire-guide-arrow left">▼</div>
        <div class="fire-guide-arrow right">▼</div>

        <div class="controls-content">
          <button id="openMapBtn" class="btn-map-select" aria-haspopup="true" aria-expanded="false" aria-label="Select Map">
            <span id="currentMapName">Carentan</span> 
            <span class="map-arrow">⇄</span>
          </button>

          <div class="custom-dropdown" id="factionDropdown">
            <button class="btn-map-select compact" id="factionBtn" aria-haspopup="true" aria-expanded="false" aria-label="Select Faction">
              <img id="currentFactionFlag" src="images/flags/us_60.webp" class="faction-flag" alt="">
              <span id="factionLabel">US</span>
              <span class="icon">▾</span>
            </button>
            <div class="dropdown-menu hidden">
              <div class="dropdown-item" data-value="all">
                <img src="images/flags/all_60.webp" class="faction-flag item-flag" onerror="this.style.display='none'">
                <span class="item-text">ALL FACTIONS</span>
              </div>
              <div class="dropdown-item" data-value="us">
                <img src="images/flags/us_60.webp" class="faction-flag item-flag">
                <span class="item-text">UNITED STATES</span>
              </div>
              <div class="dropdown-item" data-value="ger">
                <img src="images/flags/ger_60.webp" class="faction-flag item-flag">
                <span class="item-text">GERMANY</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="mapModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-brand-header">
        <div class="main-title">HLL DEFAULT GARRISONS</div>
        <div class="main-subtitle-credits">
          <button class="changelog-btn" id="changelogBtn" aria-label="View Changelog" data-tooltip="Changelog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </button>
          <a href="https://github.com/l1tku/hll-default-garrisons" target="_blank" rel="noopener noreferrer" id="appVersion"></a>
          <span class="spacer">&bull;</span>
          <a href="https://www.hellletloose.com/blog/update-20-changelog" target="_blank" rel="noopener noreferrer" id="gameVersion"></a>
          <span class="spacer">&bull;</span>
          <a href="https://github.com/l1tku" target="_blank" rel="noopener noreferrer" id="authorLink">BY LITKU</a>
        </div>
        <button class="close-btn" id="closeModalBtn" aria-label="Close Map Selection">×</button>
      </div>

      <div class="modal-sub-header">
        <div class="modal-subtitle-container">
          <div class="modal-search-wrapper">
            <input type="text" id="mapSearchInput" placeholder="SEARCH MAPS..." autocomplete="off" aria-label="Search Maps">
            <button id="clearSearchBtn" class="search-clear-btn" aria-label="Clear Search">×</button>
          </div>
        </div>
      </div>

      <div class="map-grid" id="mapGrid">
      </div>

      <div class="modal-footer">
        <button class="footer-btn secondary" id="btnOtherProjects" onclick="openProjectsModal()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          MORE PROJECTS
        </button>
      </div>
    </div>
  </div>

  <div class="garrison-legend">
    <div class="legend-item">
      <img src="images/ui/icn_garrison_shadow_locked.webp" alt="">
      <span class="legend-color red"></span>
      <span>15m Locked</span>
    </div>
    <div class="legend-item">
      <img src="images/ui/icn_garrison_shadow_warning.webp" alt="">
      <span class="legend-color yellow"></span>
      <span>50m Warning</span>
    </div>
  </div>

  <div class="zoom-slider-container">
    <div class="zoom-slider-track" id="zoomSliderTrack">
      <div class="zoom-slider-fill" id="zoomSliderFill"></div>
      <div class="zoom-slider-handle" id="zoomSliderHandle"></div>
    </div>

    <div class="zoom-icons">
      <span id="btnZoomIn" data-tooltip="Zoom In" role="button" tabindex="0" aria-label="Zoom In">+</span>
      <span id="btnZoomOut" data-tooltip="Zoom Out" role="button" tabindex="0" aria-label="Zoom Out">−</span>
      
      <span id="btnToggleStrongpoints" data-tooltip="Toggle Strongpoints" role="button" tabindex="0" aria-label="Toggle Strongpoints">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;">
          <circle cx="12" cy="12" r="8"></circle>
          <circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"></circle>
        </svg>
      </span>

      <span id="btnToggleGrid" data-tooltip="Toggle Grid" role="button" tabindex="0" aria-label="Toggle Grid">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px;">
          <rect x="3" y="3" width="18" height="18" rx="1" ry="1"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
          <line x1="15" y1="3" x2="15" y2="21"></line>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="3" y1="15" x2="21" y2="15"></line>
        </svg>
      </span>

      <span id="btnToggleRadii" data-tooltip="Toggle Radius Rings (15m / 50m)" role="button" tabindex="0" aria-label="Toggle Radius Rings">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="6"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </span>
    </div>
  </div>
  
  <div id="projectsModal" class="modal-overlay">
    <div class="modal-content projects-hub-content">
      <div class="modal-brand-header">
        <div class="main-title">OTHER PROJECTS</div>
        <button class="close-btn" id="closeProjectsBtn" aria-label="Close Projects">×</button>
      </div>

      <div class="projects-list">
        <button class="footer-btn" onclick="window.open('https://l1tku.github.io/hll-arty-map-calculator/', '_blank')">
          <img src="images/favicon_artillery.png" class="footer-project-icon" alt=""> 
          <span>HLL ARTY MAP CALCULATOR</span>
          <svg class="external-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>

        <button class="footer-btn" onclick="window.open('https://l1tku.github.io/hll-spa-calculator/', '_blank')">
          <img src="images/favicon_spa.png" class="footer-project-icon" alt=""> 
          <span>HLL SPA CALCULATOR</span>
          <svg class="external-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>

        <button class="footer-btn github-btn" onclick="window.open('https://github.com/l1tku', '_blank')">
          <img src="images/github.png" class="footer-project-icon" alt=""> 
          <span>MY GITHUB</span>
          <svg class="external-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="changelogModal" class="modal-overlay">
    <div class="modal-content changelog-modal">
      <div class="modal-brand-header">
        <div class="main-title">CHANGELOG</div>
        <button class="close-btn" id="closeChangelogBtn" aria-label="Close Changelog">×</button>
      </div>
      <div class="changelog-content" id="changelogContent">
        Loading changelog...
      </div>
    </div>
  </div>

<script src="js/maps.js"></script> 
<script src="js/script.js?v=3.36"></script>
</body>
</html>
